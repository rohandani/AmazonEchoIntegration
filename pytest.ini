[tool:pytest]
markers =
    weather_api: Tests that require OpenWeatherMap API key
    groq_api: Tests that require Groq API key  
    gemini_api: Tests that require Gemini API key
    integration: Integration tests (require network access)
    slow: Slow-running tests
addopts = 
    -ra
    --strict-markers
    --disable-warnings
testpaths = 
    tests